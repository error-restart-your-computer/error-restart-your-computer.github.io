<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>error_restart_your_computer</title>
  <meta name="description" content="Welcome to my little corner of the internet.">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #0f0f0f;
      color: #e0e0e0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem;
    }

    .container {
      text-align: center;
      max-width: 600px;
    }

    h1 {
      font-size: clamp(2rem, 8vw, 3rem);
      margin-bottom: 0.5rem;
      background: linear-gradient(135deg, #667eea, #764ba2);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    p {
      font-size: 1.1rem;
      color: #a0a0a0;
      margin-bottom: 2rem;
    }

    .links {
      display: flex;
      flex-wrap: wrap;
      gap: 1rem;
      justify-content: center;
    }

    .links a,
    .links button {
      font: inherit;
      color: #667eea;
      background: none;
      border: 1px solid #667eea;
      border-radius: 6px;
      padding: 0.5rem 1.2rem;
      cursor: pointer;
      text-decoration: none;
      transition: background 0.2s;
    }

    .links a:hover,
    .links button:hover {
      background: #667eea;
      color: #fff;
    }

    #hint {
      display: block;
      margin-top: 1rem;
      font-size: 0.85rem;
      color: #3ecf8e;
      min-height: 1.2em;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Hello, World</h1>
    <p>Welcome to my little corner of the internet.</p>

    <div class="links">
      <a href="https://github.com/error-restart-your-computer" target="_blank" rel="noopener noreferrer">GitHub</a>
      <button type="button" id="discord">Discord</button>
    </div>

    <span id="hint" role="status" aria-live="polite"></span>
  </div>

  <script>
    var hint = document.getElementById('hint');
    document.getElementById('discord').addEventListener('click', function () {
      var name = 'error_restart_your_computer';
      var done = function () {
        hint.textContent = 'Copied ' + name;
        setTimeout(function () { hint.textContent = ''; }, 2000);
      };
      if (navigator.clipboard) {
        navigator.clipboard.writeText(name).then(done);
      } else {
        done();
      }
    });
  </script>
</body>
</html>
