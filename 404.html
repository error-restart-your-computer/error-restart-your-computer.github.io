<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 — error_restart_your_computer</title>
  <meta name="robots" content="noindex">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #0f0f0f;
      color: #e0e0e0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem;
      text-align: center;
    }

    h1 {
      font-size: clamp(4rem, 20vw, 7rem);
      font-weight: 800;
      line-height: 1;
      margin-bottom: 0.75rem;
      background: linear-gradient(135deg, #667eea, #764ba2);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    p { color: #a0a0a0; font-size: 1.1rem; margin-bottom: 0.4rem; }

    .hint { color: #6f6f83; font-size: 0.9rem; margin-bottom: 2rem; }

    a {
      color: #667eea;
      border: 1px solid #667eea;
      border-radius: 6px;
      padding: 0.5rem 1.2rem;
      text-decoration: none;
      transition: background 0.2s;
    }

    a:hover { background: #667eea; color: #fff; }
  </style>
</head>
<body>
  <div>
    <h1>404</h1>
    <p>This page crashed. How fitting.</p>
    <p class="hint">Have you tried turning your computer off and on again?</p>
    <a href="/index.html">Take me home</a>
  </div>

  <script>
    console.log('%c404 — nothing to see here. Well, except this.', 'color: #667eea;');
  </script>
</body>
</html>
